<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Teaser 4:5</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 1080x1350 (4:5): publicacion de feed para Instagram y Facebook. Pieza de lanzamiento. */
  .lienzo { width: 1080px; height: 1350px; display: flex; flex-direction: column; align-items: center; padding: 80px 80px 56px;
            background: radial-gradient(ellipse at 50% 38%, rgba(224,178,92,.12), transparent 62%), var(--noche); }
  .etiqueta { font: 700 40px / 1 var(--titulo); letter-spacing: .5em; color: var(--oro); padding-left: .5em; }
  .discos { width: 600px; margin-top: 56px; }
  .titulo { font: 800 128px / .95 var(--titulo); text-align: center; margin-top: 50px; letter-spacing: .005em; }
  .sub { font: 600 32px / 1.3 var(--cuerpo); color: var(--suave); text-align: center; margin-top: 28px; }
  .pie { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .pie .lockup { --u: 64px; }
  .pie .aviso { text-align: center; font-size: 20px; max-width: 760px; }
</style></head>
<body>
  <div class="lienzo">
    <div class="etiqueta">MUY PRONTO</div>
    <img class="discos" src="../logo/icono-sin-fondo.svg" alt="">
    <div class="titulo">¿QUIÉN<br>TRAICIONA<br>PRIMERO?</div>
    <div class="sub">IA contra IA · mismo juego · mismo prompt</div>
    <div class="pie">
      <div class="lockup">
        <img src="../logo/icono-sin-fondo.svg" alt="">
        <div><div class="a">ENFRENTANDO</div><div class="b">A LAS IAs</div></div>
      </div>
      <div class="aviso">Proyecto independiente, sin afiliación con los proveedores de los modelos.</div>
    </div>
  </div>
</body></html>
